<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业型AI - 智能对话体验</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 3px;
            background: #e0e0e0;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s ease;
            width: 100%;
        }

        .section {
            padding: 20px 16px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 16px;
            text-align: center;
        }

        .scenario-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-left: 3px solid #667eea;
            padding: 14px;
            border-radius: 10px;
            margin: 14px 0;
            line-height: 1.6;
            color: #444;
            font-size: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto 0;
            font-weight: 600;
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .chat-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            max-height: 42vh;
            overflow-y: auto;
            min-height: 180px;
        }

        .message {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin: 0 6px;
        }

        .message.ai .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        .message-content {
            background: white;
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 80%;
            box-shadow: 0 1px 6px rgba(0,0,0,0.05);
            line-height: 1.5;
            white-space: pre-line;
            font-size: 15px;
        }

        .message.ai .message-content {
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .restart-btn {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
            margin-top: 16px;
        }

        .restart-btn:hover {
            background: #667eea;
            color: white;
        }

        .highlight {
            color: #667eea;
            font-weight: bold;
        }

        .current-question-area {
            margin-top: 16px;
            padding: 16px;
            background: white;
            border-radius: 12px;
            border: 2px solid #667eea;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(102, 126, 234, 0); }
        }

        .current-question-area.completed {
            display: none;
        }

        .question-label {
            color: #667eea;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .question-text {
            color: #333;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .ask-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .ask-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .ask-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .progress-indicator {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #667eea;
            transform: scale(1.15);
        }

        .progress-dot.completed {
            background: #48bb78;
        }

        .completion-message {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
        }

        .completion-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .waiting-hint {
            text-align: center;
            color: #999;
            padding: 30px 10px;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 第一步：情境介绍 -->
        <div class="section active" id="step1">
            <h1>🎯 欢迎来到AI智能对话实验室</h1>
            <div class="scenario-box">
                <p><strong>【情境设定】</strong></p>
                <p>你是一位<span class="highlight">产品经理</span>，近期因工作协调不畅、任务压力叠加产生烦躁情绪，需进行倾诉获得情感理解与支持。你打开常用的生成式 AI工具，与AI对话释放情绪、寻求安慰。请代入情境阅读后续对话，模拟真实交互并基于体验完成问卷。</p>
                <p style="margin-top: 10px;">在这个模拟环境中，你将与AI进行对话。准备好开始这段探索之旅了吗？</p>
            </div>
            <button class="btn" onclick="goToStep(3)">开始体验 →</button>
        </div>

        <!-- 第三步：对话界面 -->
        <div class="section" id="step3">
            <h1>💬 对话进行中</h1>
            
            <!-- 进度指示器 -->
            <div class="progress-indicator" id="progressIndicator">
            </div>

            <div style="text-align: center; margin-bottom: 12px;">
                <span id="selectedAiBadge" style="background: #667eea; color: white; padding: 5px 14px; border-radius: 16px; font-size: 13px;">👔 专业型</span>
            </div>
            
            <!-- 对话显示区域 -->
            <div class="chat-container" id="chatContainer">
                <div class="waiting-hint">点击下方的"发送消息"开始对话</div>
            </div>

            <!-- 当前问题区域 -->
            <div class="current-question-area" id="currentQuestionArea">
                <div class="question-label">第 <span id="currentQNum">1</span> 轮对话</div>
                <div class="question-text" id="currentQText"></div>
                <button class="ask-btn" id="askBtn" onclick="sendCurrentQuestion()">📤 发送消息</button>
            </div>

            <!-- 完成提示 -->
            <div class="completion-message" id="completionMessage">
                <h3>🎉 对话完成！</h3>
                <p>您已完成所有问题的体验，请根据感受填写问卷。</p>
            </div>
            
            <button class="btn restart-btn" onclick="restart()">↻ 重新开始体验</button>
        </div>
    </div>

    <script>
        let selectedAIType = 'professional';
        let currentQuestionIndex = 0;
        let isProcessing = false;
        
        const aiConfigs = {
            professional: {
                name: '专业型AI',
                badge: '👔 专业型',
                responses: {
                    q1: '市场部再三推脱，大概率是优先级冲突、需求模糊或权责不明这三个原因。要破局，最有效的做法是整理清晰的数据清单，当对方意识到这不是帮忙而是共同规避责任黑洞时，配合度通常会高很多。',
                    q2: '文字沟通失效，说明对方在刻意回避压力，下一步需要升级。把数据需求和沟通记录抄送双方领导，说明项目卡点请对方确认时间；同时当面锁定负责人，若整份数据出不来就请对方先给原始数据由你整理、他只负责把关，用降低难度逼出确切承诺。',
                    q3: '担心被批评是正常的，但项目卡住不解决，等延期了再被迫解释，那时候才真显得协调能力有问题。现在主动汇报反而是掌控节奏，拉会也不用兴师动众，就拉双方执行人和一个能拍板的领导，会前说清楚"项目卡在数据这步了，想请大家对齐一下时间，避免影响最终交付"——把目标定在定时间而不是追责，大家压力都小。',
                    q4: '好，跟领导说的时候，别把它描述成"我去告状"，而是"我来同步一下风险"——把问题转化成进度同步，领导会更容易站在你这边。你只需要如实说出项目现状、缺什么、已经沟通几次但没有明确时间节点，请领导帮忙协调或定个方向就行。'
                }
            }
        };

        const questions = [
            '我负责的项目要市场部给一份数据支持，跟他们沟通了三次，每次都找借口推脱',
            '已经发过文字了，他们还是说“没时间”“数据没整理好”，根本不配合',
            '我怕跟领导说，显得我协调能力不行；拉会又怕太兴师动众，大家都尴尬',
            '那我试试跟领导说'
        ];

        function goToStep(step) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            if (step === 3) initChat();
        }

        function initChat() {
            const container = document.getElementById('chatContainer');
            currentQuestionIndex = 0;
            isProcessing = false;
            container.innerHTML = '<div class="waiting-hint">点击下方的"发送消息"开始对话</div>';
            document.getElementById('completionMessage').classList.remove('show');
            document.getElementById('currentQuestionArea').classList.remove('completed');
            
            const indicator = document.getElementById('progressIndicator');
            indicator.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.id = `dot-${i}`;
                indicator.appendChild(dot);
            }
            updateCurrentQuestion();
        }

        function updateCurrentQuestion() {
            if (currentQuestionIndex >= questions.length) {
                document.getElementById('currentQuestionArea').classList.add('completed');
                document.getElementById('completionMessage').classList.add('show');
                return;
            }
            for (let i = 0; i < questions.length; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.classList.remove('active', 'completed');
                if (i < currentQuestionIndex) dot.classList.add('completed');
                else if (i === currentQuestionIndex) dot.classList.add('active');
            }
            document.getElementById('currentQNum').textContent = currentQuestionIndex + 1;
            document.getElementById('currentQText').textContent = questions[currentQuestionIndex];
            document.getElementById('askBtn').disabled = false;
            document.getElementById('askBtn').textContent = '📤 发送消息';
        }

        async function sendCurrentQuestion() {
            if (isProcessing || currentQuestionIndex >= questions.length) return;
            isProcessing = true;
            const btn = document.getElementById('askBtn');
            btn.disabled = true;
            btn.textContent = '发送中...';
            
            const container = document.getElementById('chatContainer');
            const config = aiConfigs[selectedAIType];
            const questionText = questions[currentQuestionIndex];
            const answerText = config.responses[`q${currentQuestionIndex + 1}`];
            
            if (currentQuestionIndex === 0) container.innerHTML = '';
            await addMessage('user', questionText, container);
            await wait(600);
            const typingId = addTypingIndicator(container);
            await wait(1500);
            removeTypingIndicator(typingId);
            await addMessage('ai', answerText, container);
            
            currentQuestionIndex++;
            updateCurrentQuestion();
            isProcessing = false;
        }

        function addMessage(type, text, container) {
            return new Promise(resolve => {
                const div = document.createElement('div');
                div.className = `message ${type}`;
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = type === 'user' ? '🙂' : '🤖';
                const content = document.createElement('div');
                content.className = 'message-content';
                content.textContent = text;
                div.appendChild(avatar);
                div.appendChild(content);
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
                setTimeout(resolve, 300);
            });
        }

        function addTypingIndicator(container) {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = id;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';
            const content = document.createElement('div');
            content.className = 'message-content typing-indicator';
            content.innerHTML = '<span></span><span></span><span></span>';
            div.appendChild(avatar);
            div.appendChild(content);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function restart() {
            currentQuestionIndex = 0;
            isProcessing = false;
            goToStep(1);
        }
    </script>
</body>
</html>
